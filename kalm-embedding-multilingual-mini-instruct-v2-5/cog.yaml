build:
  gpu: true
  cuda: "12.6"
  python_version: "3.10"
  sdk_version: "0.23.1"
  python_requirements: requirements.txt
  run:
    - >-
      python -c "from accelerate import init_empty_weights; from transformers.modeling_utils import PreTrainedModel; PreTrainedModel.get_init_context(is_quantized=False, _is_ds_init_called=False)"
run: "predict.py:Runner"
